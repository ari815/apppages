<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Old English Fill-in-the-Blank</title>
<style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f4f8; color: #333; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    h1 { color: #2c3e50; }
    #quiz-container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 800px; width: 100%; position: relative; z-index: 10; }
    
    /* Text Area */
    #text-display { font-size: 1.2rem; line-height: 2; margin-bottom: 30px; text-align: justify; }
    .blank { display: inline-block; border-bottom: 2px solid #3498db; min-width: 80px; text-align: center; color: #3498db; font-weight: bold; cursor: default; padding: 0 5px; transition: all 0.3s; }
    .blank.filled { border-bottom: 2px solid #27ae60; color: #27ae60; }
    .blank.active { background-color: #e8f6fd; border-bottom: 2px solid #e67e22; box-shadow: 0 0 5px rgba(230, 126, 34, 0.5); }

    /* Word Bank */
    #word-bank { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; padding-top: 20px; border-top: 1px solid #eee; }
    .word-btn { background: #fff; border: 2px solid #3498db; color: #3498db; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 1rem; transition: transform 0.1s, background 0.2s; user-select: none; }
    .word-btn:hover { background: #e8f6fd; transform: translateY(-2px); }
    .word-btn:active { transform: translateY(0); }
    .word-btn.used { opacity: 0.3; cursor: default; transform: none !important; border-color: #ccc; color: #ccc; pointer-events: none; }

    /* Feedback */
    #feedback { height: 30px; text-align: center; font-weight: bold; font-size: 1.2rem; margin: 10px 0; }
    .good { color: #27ae60; animation: pop 0.3s; }
    .bad { color: #c0392b; animation: shake 0.3s; }

    /* Animations */
    @keyframes pop { 50% { transform: scale(1.2); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

    /* Result Overlay */
    #result-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; flex-direction: column; color: white; }
    #result-box { background: white; color: #333; padding: 40px; border-radius: 10px; text-align: center; max-width: 400px; width: 90%; }
    #score-display { font-size: 3rem; font-weight: bold; color: #2c3e50; margin: 20px 0; }
    button.restart { background: #3498db; color: white; border: none; padding: 10px 20px; font-size: 1.2rem; border-radius: 5px; cursor: pointer; }
    
    /* Confetti Canvas */
    #confetti-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<h1>Old English Fill-in-the-Blank</h1>

<div id="quiz-container">
    <div id="text-display"></div>
    <div id="feedback"></div>
    <div id="word-bank"></div>
</div>

<div id="result-overlay">
    <div id="result-box">
        <h2>Result</h2>
        <div id="score-display">0%</div>
        <p id="result-msg"></p>
        <button class="restart" onclick="location.reload()">Try Again</button>
    </div>
</div>

<script>
    // 1. Data Setup
    const fullText = "Eala ure fæder þe on heofonum eart, a sy ðin nama ecelice gebletsod; and ðin ricedom ofer us rixie symble, and ðin willa gewyrðe swa swa on heofonum eac swa on eorðan. Geunn us to þissum dæge dæghwamlices fostres. And us gemildsa swa swa we miltsiað þam ðe wið us agyltaþ; and ne læt ðu us costnian ealles to swyðe, ac alys us fram yfele, amen.";
    
    // Choose 10 specific keywords to blank out (indices are roughly calculated based on split)
    const targetWords = [
        "fæder", "heofonum", "nama", "gebletsod", "ricedom", 
        "willa", "eorðan", "dæghwamlices", "miltsiað", "yfele"
    ];

    let tokens = [];
    let blanks = [];
    let currentBlankIndex = 0;
    let mistakes = 0;
    let totalBlanks = 0;

    // Audio Context Setup (Browser Synth)
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'good') {
            // Ding!
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, now); // A5
            osc.frequency.exponentialRampToValueAtTime(1760, now + 0.1);
            gainNode.gain.setValueAtTime(0.3, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc.start(now);
            osc.stop(now + 0.5);
        } else if (type === 'bad') {
            // Buzz
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(100, now + 0.3);
            gainNode.gain.setValueAtTime(0.3, now);
            gainNode.gain.linearRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        } else if (type === 'fanfare') {
            // Simple Major Arpeggio
            const notes = [523.25, 659.25, 783.99, 1046.50]; // C Major
            let time = now;
            notes.forEach((freq, i) => {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.connect(g);
                g.connect(audioCtx.destination);
                o.type = 'triangle';
                o.frequency.value = freq;
                g.gain.setValueAtTime(0.1, time);
                g.gain.exponentialRampToValueAtTime(0.01, time + 1.0); // Longer fade
                o.start(time);
                o.stop(time + 1.0);
                time += 0.15;
            });
        }
    }

    // 2. Initialize Logic
    function init() {
        // Clean text and split but keep punctuation logic simple for this demo
        // We will do a simple replace approach to preserve punctuation
        let tempText = fullText;
        let blankId = 0;

        // Create blanks in text
        // Note: Using regex to replace only specific instances is tricky with duplicates. 
        // We will iterate and replace strictly to the list order if possible, 
        // but for robustness in this snippet, we replace occurrences found.
        
        // Better strategy for this specific text: Build DOM manually
        // Splitting by space to tokenize
        const rawWords = fullText.split(' ');
        const displayContainer = document.getElementById('text-display');
        const wordBankContainer = document.getElementById('word-bank');
        
        let targetQueue = [...targetWords]; // Copy
        let usedTargets = []; // To store shuffled buttons later

        // Process text to insert blanks
        let htmlContent = "";
        
        // Simplistic replacement strategy for the exact text provided
        // We replace the FIRST occurrence of each target word to ensure order matches logic roughly
        // or we can just replace ALL occurrences.
        // Let's use a token map approach.
        
        let processedText = fullText;
        
        // We need to protect the order.
        // Let's construct the HTML string by finding indices.
        // Since "heofonum" is there twice, we need to be careful.
        
        // Specific Manual Construction for precision with this text:
        // Because automatic NLP is hard in a single file, I'll map the known structure.
        
        // Let's iterate words and if they match the *next needed* target word (ignoring punctuation), blank it.
        let targetIndex = 0;
        
        const wordsArray = fullText.match(/[\wðþæ]+|[.,;]/g); // Simple tokenizer
        // Actually, let's keep it simple: Split by spaces, strip punctuation for check.
        
        const segments = fullText.split(/([ \n,;.]+)/); // Split keeping delimiters
        
        segments.forEach(segment => {
            let cleanWord = segment.trim().replace(/[.,;]/g, '');
            let isTarget = false;
            
            // If this word matches the NEXT target word in our list
            if (targetIndex < targetWords.length && cleanWord === targetWords[targetIndex]) {
                // It is a blank
                htmlContent += `<span class="blank" id="blank-${targetIndex}" data-answer="${cleanWord}">(${targetIndex + 1})</span>`;
                usedTargets.push(cleanWord);
                targetIndex++;
            } else {
                htmlContent += segment;
            }
        });
        
        displayContainer.innerHTML = htmlContent;
        totalBlanks = targetIndex;

        // Highlight first blank
        document.getElementById(`blank-0`).classList.add('active');

        // Setup Buttons (Shuffled)
        const shuffledWords = [...usedTargets].sort(() => Math.random() - 0.5);
        shuffledWords.forEach(word => {
            const btn = document.createElement('button');
            btn.className = 'word-btn';
            btn.textContent = word;
            btn.onclick = () => handleInput(word, btn);
            wordBankContainer.appendChild(btn);
        });
    }

    // 3. Game Logic
    function handleInput(selectedWord, btnElement) {
        if (currentBlankIndex >= totalBlanks) return;

        const currentBlank = document.getElementById(`blank-${currentBlankIndex}`);
        const feedback = document.getElementById('feedback');
        const expectedAnswer = currentBlank.dataset.answer;

        if (selectedWord === expectedAnswer) {
            // Correct
            feedback.textContent = "Good!";
            feedback.className = "good";
            playSound('good');

            // Update Blank
            currentBlank.textContent = selectedWord;
            currentBlank.classList.remove('active');
            currentBlank.classList.add('filled');
            
            // Disable button
            btnElement.classList.add('used');

            currentBlankIndex++;
            
            // Prepare next
            if (currentBlankIndex < totalBlanks) {
                document.getElementById(`blank-${currentBlankIndex}`).classList.add('active');
            } else {
                finishGame();
            }

        } else {
            // Incorrect
            feedback.textContent = "Oh-oh!!";
            feedback.className = "bad";
            playSound('bad');
            mistakes++;
        }
    }

    function finishGame() {
        const score = Math.max(0, Math.round(((totalBlanks - mistakes) / totalBlanks) * 100));
        const overlay = document.getElementById('result-overlay');
        const scoreText = document.getElementById('score-display');
        const msg = document.getElementById('result-msg');

        scoreText.textContent = `${score}%`;
        overlay.style.display = 'flex';

        if (score >= 80) {
            msg.textContent = "Excellent! You know your Old English!";
            playSound('fanfare');
            startConfetti();
        } else {
            msg.textContent = "Good try! Keep practicing.";
        }
    }

    // 4. Confetti Logic (Simple Implementation)
    function startConfetti() {
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        const colors = ['#f1c40f', '#e74c3c', '#3498db', '#9b59b6', '#2ecc71'];

        for(let i=0; i<150; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height - canvas.height,
                w: Math.random() * 10 + 5,
                h: Math.random() * 10 + 5,
                color: colors[Math.floor(Math.random() * colors.length)],
                speed: Math.random() * 3 + 2,
                angle: Math.random() * 360
            });
        }

        function draw() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.angle * Math.PI / 180);
                ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
                ctx.restore();
                
                p.y += p.speed;
                p.angle += 2;
                
                if(p.y > canvas.height) p.y = -10;
            });
            requestAnimationFrame(draw);
        }
        draw();
    }

    // Start
    init();

</script>
</body>
</html>
